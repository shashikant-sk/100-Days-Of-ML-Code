name: SEO Automation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  seo_automation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run SEO Automation Script
        run: python3 seo_automation.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || (git commit -m "chore: auto-update SEO attributes" && git push)
